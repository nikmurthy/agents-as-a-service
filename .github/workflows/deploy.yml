# Deploys the server and worker to Fly.io (London).
# Every secret in the Bitwarden project goes straight into Fly's encrypted store at run time;
# nothing production-related is stored in GitHub except the Bitwarden access token and a Fly deploy
# token that can deploy only this app.
name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_APP: aaas-platform
    steps:
      - uses: actions/checkout@v4

      - name: Check GitHub settings
        env:
          HAS_FLY_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
          HAS_BW_TOKEN: ${{ secrets.BW_ACCESS_TOKEN != '' }}
        run: |
          ok=1
          if [ "$HAS_FLY_TOKEN" = "true" ]; then echo "✓ FLY_API_TOKEN is set"; else echo "::error::FLY_API_TOKEN is missing. Create one with: fly tokens create deploy -a $FLY_APP, then add it under Settings → Environments → production → Environment secrets."; ok=0; fi
          if [ "$HAS_BW_TOKEN" = "true" ]; then echo "✓ BW_ACCESS_TOKEN is set"; else echo "::error::BW_ACCESS_TOKEN is missing."; ok=0; fi
          [ "$ok" = 1 ] || exit 1

      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.5.12

      - name: Install the Bitwarden Secrets Manager CLI
        env:
          BWS_VERSION: 2.1.0
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/bitwarden/sdk-sm/releases/download/bws-v$BWS_VERSION"
          curl -fsSLO "$base/bws-x86_64-unknown-linux-gnu-$BWS_VERSION.zip"
          curl -fsSLO "$base/bws-sha256-checksums-$BWS_VERSION.txt"
          grep " bws-x86_64-unknown-linux-gnu-$BWS_VERSION.zip" "bws-sha256-checksums-$BWS_VERSION.txt" | sha256sum -c -
          unzip -q "bws-x86_64-unknown-linux-gnu-$BWS_VERSION.zip" -d bws-bin
          echo "$RUNNER_TEMP/bws-bin" >> "$GITHUB_PATH"

      # Every secret in the Bitwarden project goes into Fly, so a new secret only needs adding in Bitwarden
      # (named exactly as the variable in .env.example). Names set in fly.toml [env] are skipped.
      # Staged: takes effect with the deploy below. Values are masked and never printed.
      - name: Copy secrets from Bitwarden into Fly
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
          BW_PROJECT_ID: ${{ vars.BW_PROJECT_ID }}
          BW_PROJECT_NAME: agents-as-a-service-production
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          pid="$BW_PROJECT_ID"
          if [ -z "$pid" ]; then
            projects="$(bws project list --output json)"
            pid="$(jq -r --arg n "$BW_PROJECT_NAME" '[.[] | select(.name == $n)][0].id // empty' <<<"$projects")"
            [ -n "$pid" ] || { [ "$(jq length <<<"$projects")" = 1 ] && pid="$(jq -r '.[0].id' <<<"$projects")"; } || true
          fi
          [ -n "$pid" ] || { echo "::error::Couldn't find the Bitwarden project. Set a BW_PROJECT_ID variable in the production environment."; exit 1; }
          secrets="$(bws secret list "$pid" --output json)"
          jq -r '.[].value | split("\n")[] | select(length > 0) | "::add-mask::" + .' <<<"$secrets"
          skip='["PORT","NODE_ENV","AGENT_MODE","PUBLIC_BASE_URL","SUPABASE_URL","SUPABASE_ANON_KEY"]'
          jq -r '.[].key | select(test("^[A-Z_][A-Z0-9_]*$") | not) | "::warning::Skipped the Bitwarden secret named \"" + . + "\": names must be capital letters, digits and _ only, exactly as in .env.example"' <<<"$secrets"
          jq -r --argjson skip "$skip" '.[] | select(.key | test("^[A-Z_][A-Z0-9_]*$")) | select((.key | IN($skip[])) | not) | select(.value != "") | "\(.key)=\(.value)"' <<<"$secrets" \
            | flyctl secrets import --app "$FLY_APP" --stage > /dev/null
          echo "Secrets now in Fly:"; flyctl secrets list --app "$FLY_APP"
          for name in DATABASE_URL DATA_ENCRYPTION_KEY SIGNING_SECRET ANTHROPIC_API_KEY WA_APP_SECRET WA_VERIFY_TOKEN \
                      GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            jq -e --arg n "$name" 'any(.[]; .key == $n and .value != "")' <<<"$secrets" > /dev/null || echo "::warning::$name is not in Bitwarden yet"
          done

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --ha=false: one machine per process to start with; scale with `fly scale count`.
        run: flyctl deploy --app "$FLY_APP" --remote-only --ha=false

      - name: Check the live app
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://$FLY_APP.fly.dev/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::/health did not respond"; exit 1
